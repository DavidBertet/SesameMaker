; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; One env per chip (binaries are chip-specific; boards sharing a chip share
; the image — GPIO numbers are chip-level and partitions_4mb.csv fits every
; 4MB+ devkit). IDF sets CONFIG_SOC_IEEE802154_SUPPORTED on 802.15.4
; targets, which gates zigbee.c — no per-target flags needed.
; [env:sesame-cli] is the CLI sandbox: install.sh prompts for a board and
; rewrites it here (any chip). The sesame-c* envs are fixed release targets
; and are never touched by the CLI. Bare `pio run` stays on the sandbox via
; default_envs. PIO flashes board_build.partitions; the IDF build assumes
; the same table via CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in
; sdkconfig.defaults.
[platformio]
default_envs = sesame-cli

[env]
platform = espressif32 @ 6.13.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
; Firmware identity baked from the environment (the CLI and CI export
; FW_VERSION / FW_GIT_SHA from git; unset on plain runs -> dev/unknown via
; the fallbacks in ws_settings.c).
; Self-update trust anchors: OTA_RELEASE_BASE + OTA_PUBKEY_HEX
; (uncompressed P-256 point minus the 0x04 prefix, 128 hex chars) override
; the production defaults for local testing — export both, e.g. pointed at
; tools/ota_dev_release.sh output. Empty key = on-device updates refused.
build_flags =
  -D FW_VERSION='"${sysenv.FW_VERSION}"'
  -D FW_GIT_SHA='"${sysenv.FW_GIT_SHA}"'
  -D OTA_RELEASE_BASE='"${sysenv.OTA_RELEASE_BASE}"'
  -D OTA_PUBKEY_HEX='"${sysenv.OTA_PUBKEY_HEX}"'

[env:sesame-cli]
board = esp32-c6-devkitm-1

[env:sesame-c6]
board = esp32-c6-devkitm-1

[env:sesame-c3]
board = esp32-c3-devkitm-1

[env:sesame-s3]
board = esp32-s3-devkitc-1
