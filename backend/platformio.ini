; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Single env for every board: the `board` line below selects the target and
; IDF sets CONFIG_SOC_IEEE802154_SUPPORTED on 802.15.4 targets, which gates
; zigbee.c — no per-target envs, no custom flags. Flash size comes from the
; board manifest (all our boards ship 4MB+) and fits partitions_4mb.csv.
; PIO flashes board_build.partitions; the IDF build assumes the same table
; via CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in sdkconfig.defaults.
[env:sesame]
platform = espressif32 @ 6.13.0
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_4mb.csv
; Firmware identity baked from the environment (the CLI and CI export
; FW_VERSION / FW_GIT_SHA from git; unset on plain runs -> dev/unknown via
; the fallbacks in ws_settings.c).
build_flags =
  -D FW_VERSION='"${sysenv.FW_VERSION}"'
  -D FW_GIT_SHA='"${sysenv.FW_GIT_SHA}"'
