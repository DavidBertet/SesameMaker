# Release firmware binaries for browser flashing (Getting started tab).
#
# On every v* tag: build the device frontend into backend/data, build the
# firmware + SPIFFS image, merge bootloader/partitions/otadata/app into one
# factory image, and attach everything plus a flash manifest to the GitHub
# release. The web flasher fetches the manifest for the picked version and
# burns factory.bin @0x0 + spiffs.bin at its partition offset.
#
# Asset layout per release ($TAG = vX.Y.Z, $CHIP = esp32c6/esp32c3/esp32s3):
#   sesamemaker-$CHIP-$TAG-factory.bin   merged image, flash at 0x0 (browser)
#   sesamemaker-$CHIP-$TAG-spiffs.bin    web UI image, flash at 0x37C000 (browser)
#   sesamemaker-$CHIP-$TAG-app.bin       app image for on-device OTA (inactive ota_x slot)
#   sesamemaker-$CHIP-manifest.json      UNVERSIONED name so both the browser
#     (…/releases/download/$TAG/…) and the device (…/releases/latest/download/…)
#     fetch it from a stable URL; the version lives inside.
# Manifest: {version, chip, files:[...], app:{...}, signature, key_id}.
# `files` (factory+spiffs, hex offsets) drive the browser flasher; `app`
# drives on-device OTA. `signature` is ECDSA-P256 over the canonical manifest
# (tools/sign_manifest.py) — the device rejects unsigned manifests.
# SPIFFS offset comes from backend/partitions_4mb.csv — keep them in sync.

name: Release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - chip: esp32c6
            pio_env: sesame-c6
            manifest_chip: ESP32-C6
            spiffs_offset: 0x37C000
          - chip: esp32c3
            pio_env: sesame-c3
            manifest_chip: ESP32-C3
            spiffs_offset: 0x37C000
          - chip: esp32s3
            pio_env: sesame-s3
            manifest_chip: ESP32-S3
            spiffs_offset: 0x37C000
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO, esptool and signing deps
        run: pip install platformio esptool cryptography

      - name: Firmware version
        run: |
          echo "FW_VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "FW_GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build device frontend into backend/data
        run: |
          npm ci
          npm run build
        working-directory: ./frontend

      - name: Build firmware
        run: pio run -e ${{ matrix.pio_env }}
        working-directory: ./backend

      - name: Build SPIFFS image
        run: pio run -t buildfs -e ${{ matrix.pio_env }}
        working-directory: ./backend

      - name: Merge factory image and manifest
        env:
          MERGE_CHIP: ${{ matrix.chip }}
        run: |
          B=backend/.pio/build/${{ matrix.pio_env }}
          TAG=${GITHUB_REF_NAME}
          CHIP=${MERGE_CHIP}
          PREFIX="sesamemaker-${CHIP}-${TAG}"
          esptool.py --chip ${CHIP} merge_bin \
            --flash-mode dio --flash-freq 80m --flash-size 4MB \
            -o "${PREFIX}-factory.bin" \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xd000 "$B/ota_data_initial.bin" \
            0x10000 "$B/firmware.bin"
          cp "$B/spiffs.bin" "${PREFIX}-spiffs.bin"
          cp "$B/firmware.bin" "${PREFIX}-app.bin"
          PREFIX="$PREFIX" MANIFEST="sesamemaker-${{ matrix.chip }}-manifest.json" MANIFEST_CHIP="${{ matrix.manifest_chip }}" SPIFFS_OFFSET="${{ matrix.spiffs_offset }}" python3 - <<'EOF'
          import hashlib, json, os
          prefix = os.environ["PREFIX"]
          def entry(name, offset):
              h = hashlib.sha256()
              with open(name, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return {"name": name, "offset": offset, "size": os.path.getsize(name),
                      "sha256": h.hexdigest()}
          manifest = {
              "version": os.environ["GITHUB_REF_NAME"],
              "chip": os.environ["MANIFEST_CHIP"],
              "files": [
                  entry(f"{prefix}-factory.bin", "0x0"),
                  entry(f"{prefix}-spiffs.bin", os.environ["SPIFFS_OFFSET"]),
              ],
              "app": entry(f"{prefix}-app.bin", "ota"),
          }
          with open(os.environ["MANIFEST"], "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Sign manifest (ECDSA-P256, key in OTA_SIGNING_KEY secret)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          MANIFEST="sesamemaker-${{ matrix.chip }}-manifest.json"
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::OTA_SIGNING_KEY secret not set — refusing to ship an unsigned manifest"
            exit 1
          fi
          printf '%s' "$OTA_SIGNING_KEY" > /tmp/ota-signing-key.pem
          python3 tools/sign_manifest.py sign \
            --manifest "${MANIFEST}" \
            --key /tmp/ota-signing-key.pem --key-id 0
          rm /tmp/ota-signing-key.pem

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sesamemaker-*-factory.bin
            sesamemaker-*-spiffs.bin
            sesamemaker-*-app.bin
            sesamemaker-*-manifest.json
          generate_release_notes: true
