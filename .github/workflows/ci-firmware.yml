# Firmware matrix: proves every chip variant compiles. Backend changes
# only — ESP-IDF builds are too expensive to run on every commit. C6 covers
# the 802.15.4/Zigbee path, C3 the no-radio path; S3 rides along in
# releases (same no-radio shape as C3) without burning CI on each push.

name: CI firmware

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-firmware.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-firmware.yml'

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [sesame-c6, sesame-c3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('backend/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Firmware version
        run: |
          echo "FW_VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_ENV
          echo "FW_GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}
        working-directory: ./backend
