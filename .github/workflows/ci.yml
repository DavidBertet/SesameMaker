# CI proof per push: validate only, never deploys or publishes.
# Runs on main pushes and PRs. Releases (tags) run release.yml + deploy-page.yml.
# Firmware matrix lives in ci-firmware.yml (backend changes only) — three
# ESP-IDF builds on every commit is too expensive for a lint gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint (Prettier + boundary)
        run: npm run lint

      - name: Run tests (CLI + frontend + backend host)
        run: npm run test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test manifest signer
        run: |
          pip install cryptography
          python3 tools/sign_manifest.test.py
